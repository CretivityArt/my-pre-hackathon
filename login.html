<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — HackaTronics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-page">

        <!-- ---- Left: brand panel ---- -->
        <div class="login-brand-panel">
            <div class="sidebar-logo">
                <img src="assets/images/logo.svg" alt="Borcelle logo">
                <div class="sidebar-logo-text">
                    Borcelle
                    <span>Digital Wallet</span>
                </div>
            </div>
            <h2>Take a detailed look at your financial situation, anytime.</h2>
            <p>Track balances, manage payments, and follow every transaction from one simple dashboard.</p>
        </div>

        <!-- ---- Right: login form ---- -->
        <div class="login-form-panel">
            <div class="login-form-box">
                <h1>Welcome back</h1>
                <p class="subtitle">Log in to continue to your dashboard.</p>

                <!-- Message box for errors/success, controlled by login.js -->
                <div id="formMessage" class="form-message"></div>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
                    </div>

                    <div class="form-row-between">
                        <label class="checkbox-row">
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">Log In</button>
                </form>

                <p class="login-footer-text">
                    Don't have an account? <a href="#">Contact your bank</a>
                </p>
            </div>
        </div>
    </div>

    <!-- api.js must load before login.js since login.js calls loginUser() -->
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
